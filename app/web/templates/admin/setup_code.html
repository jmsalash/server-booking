{% extends "admin/base.html" %}
{% block title %}Setup — Server booking{% endblock %}
{% block admin_content %}
<section class="panel login">
  <h1>Set up server booking</h1>
  <p>Enter the setup code printed in the web container's log (<code>SETUP CODE: XXXX-XXXX-XXXX</code>).</p>
  {% if error %}<div class="banner banner--error">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/setup" class="form">
    <label>Setup code <input name="code" autocomplete="off" required autofocus></label>
    <button type="submit">Continue</button>
  </form>
</section>
{% endblock %}
