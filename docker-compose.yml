x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://booking:booking@db/booking
  DATA_DIR: /data
  RESET_SETUP: ${RESET_SETUP:-0}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.web.main:create_app --factory --host 0.0.0.0 --port 8000 --proxy-headers"
    environment: *app-env
    ports:
      - "8000:8000"
    volumes:
      - data:/data
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: python -m app.worker
    environment: *app-env
    volumes:
      - data:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  data:
